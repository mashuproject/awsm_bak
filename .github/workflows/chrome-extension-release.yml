name: Browser Extension Release

on:
  pull_request:
    paths:
      - ".github/workflows/chrome-extension-release.yml"
      - "apps/browser-extension/**"
      - "apps/runtime-go/**"
      - "apps/coordination-server/app/helpers/**"
      - "apps/coordination-server/app/views/**"
      - "docs/guides/install-chrome-extension.md"
      - "docs/guides/install-desktop-runtime.md"
      - "docs/guides/install-firefox-extension.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      operation:
        description: Browser release operation
        required: true
        type: choice
        default: validate-only
        options:
          - validate-only
          - sign-firefox-candidate
      resume_run_id:
        description: Prior candidate run that preserved an AMO upload identity
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firefox-pr-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: |
          corepack pnpm lint
          corepack pnpm typecheck

      - name: Run unit tests
        run: corepack pnpm test

      - name: Build and validate Firefox MV3
        run: |
          corepack pnpm --filter @awsm/browser-extension build:firefox
          corepack pnpm --filter @awsm/browser-extension exec web-ext lint --source-dir .output/firefox-mv3

  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      archive_name: ${{ steps.metadata.outputs.archive_name }}
      checksum_name: ${{ steps.metadata.outputs.checksum_name }}
      commit: ${{ steps.revision.outputs.commit }}
      desktop_linux_checksum_name: ${{ steps.metadata.outputs.desktop_linux_checksum_name }}
      desktop_linux_name: ${{ steps.metadata.outputs.desktop_linux_name }}
      desktop_macos_checksum_name: ${{ steps.metadata.outputs.desktop_macos_checksum_name }}
      desktop_macos_name: ${{ steps.metadata.outputs.desktop_macos_name }}
      desktop_windows_checksum_name: ${{ steps.metadata.outputs.desktop_windows_checksum_name }}
      desktop_windows_name: ${{ steps.metadata.outputs.desktop_windows_name }}
      firefox_xpi_name: ${{ steps.metadata.outputs.firefox_xpi_name }}
      firefox_checksum_name: ${{ steps.metadata.outputs.firefox_checksum_name }}
      firefox_source_name: ${{ steps.metadata.outputs.firefox_source_name }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Prepare release output
        run: mkdir dist

      - name: Derive release metadata
        id: metadata
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node apps/browser-extension/scripts/chrome-release-metadata.mjs

      - name: Resolve exact release commit
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require candidate or tagged commit to belong to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ steps.revision.outputs.commit }}" origin/main

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Run unit tests
        run: corepack pnpm test

      - name: Build production extension
        run: corepack pnpm build

      - name: Create browser archives
        run: corepack pnpm zip

      - name: Package and verify browser release inputs
        env:
          ARCHIVE_NAME: ${{ steps.metadata.outputs.archive_name }}
          CHECKSUM_NAME: ${{ steps.metadata.outputs.checksum_name }}
          FIREFOX_SOURCE_NAME: ${{ steps.metadata.outputs.firefox_source_name }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mapfile -t chrome_archives < <(find apps/browser-extension/.output -maxdepth 1 -type f -name '*-chrome.zip' -print)
          if [[ "${#chrome_archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one Chrome ZIP, found ${#chrome_archives[@]}" >&2
            exit 1
          fi
          mapfile -t firefox_archives < <(find apps/browser-extension/.output -maxdepth 1 -type f -name '*-firefox.zip' -print)
          if [[ "${#firefox_archives[@]}" -ne 1 ]]; then
            echo "Expected exactly one deterministic Firefox ZIP, found ${#firefox_archives[@]}" >&2
            exit 1
          fi
          mapfile -t firefox_sources < <(find apps/browser-extension/.output -maxdepth 1 -type f -name '*-sources.zip' -print)
          if [[ "${#firefox_sources[@]}" -ne 1 ]]; then
            echo "Expected exactly one Firefox source ZIP, found ${#firefox_sources[@]}" >&2
            exit 1
          fi
          mv "${chrome_archives[0]}" "dist/$ARCHIVE_NAME"
          cp "${firefox_archives[0]}" "dist/awsm-firefox-unsigned-v$VERSION.zip"
          cp "${firefox_sources[0]}" "dist/$FIREFOX_SOURCE_NAME"
          unzip -t "dist/$ARCHIVE_NAME"
          if [[ "$(unzip -Z1 "dist/$ARCHIVE_NAME" | grep -Fxc 'manifest.json')" -ne 1 ]]; then
            echo "Archive must contain exactly one root manifest.json" >&2
            exit 1
          fi
          cd dist
          sha256sum "$ARCHIVE_NAME" > "$CHECKSUM_NAME"
          sha256sum "awsm-firefox-unsigned-v$VERSION.zip" > "awsm-firefox-unsigned-v$VERSION.zip.sha256"
          sha256sum "$FIREFOX_SOURCE_NAME" > "$FIREFOX_SOURCE_NAME.sha256"
          sha256sum --check "$CHECKSUM_NAME"
          sha256sum --check "awsm-firefox-unsigned-v$VERSION.zip.sha256"
          sha256sum --check "$FIREFOX_SOURCE_NAME.sha256"

      - name: Upload validated release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-extension-inputs-${{ steps.metadata.outputs.tag }}
          path: |
            dist/${{ steps.metadata.outputs.archive_name }}
            dist/${{ steps.metadata.outputs.checksum_name }}
            dist/awsm-firefox-unsigned-v${{ steps.metadata.outputs.version }}.zip
            dist/awsm-firefox-unsigned-v${{ steps.metadata.outputs.version }}.zip.sha256
            dist/${{ steps.metadata.outputs.firefox_source_name }}
            dist/${{ steps.metadata.outputs.firefox_source_name }}.sha256
            dist/chrome-release-notes.md
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  desktop-build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            target: linux/amd64
          - platform: windows
            runner: windows-latest
            target: windows/amd64
          - platform: macos
            runner: macos-latest
            target: darwin/universal
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: apps/runtime-go/go.mod
          cache-dependency-path: apps/runtime-go/go.sum

      - name: Derive release version
        id: metadata
        shell: bash
        run: |
          version=$(node --print "require('./apps/browser-extension/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set Wails product version
        shell: bash
        working-directory: apps/runtime-go/cmd/awsm
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const configPath = "wails.json";
          const config = JSON.parse(await readFile(configPath, "utf8"));
          config.info = { ...(config.info ?? {}), productVersion: process.env.VERSION };
          await writeFile(configPath, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes file fuse3 libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Install Windows NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          $nsisPath = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          if (-not (Test-Path (Join-Path $nsisPath "makensis.exe"))) {
            throw "NSIS installation did not provide makensis.exe"
          }
          $nsisPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build shared desktop frontend
        run: corepack pnpm build:runtime:frontend

      - name: Build Wails desktop target
        shell: bash
        working-directory: apps/runtime-go/cmd/awsm
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          tags="desktop,production"
          if [[ "$PLATFORM" == "linux" ]]; then
            tags="$tags,webkit2_41"
          fi
          flags=(
            build
            -clean
            -platform "$TARGET"
            -tags "$tags"
            -s
            -m
            -nosyncgomod
            -skipbindings
            -skipembedcreate
            -trimpath
            -ldflags "-X main.appVersion=$VERSION"
          )
          if [[ "$PLATFORM" == "windows" ]]; then
            flags+=( -nsis -webview2 download )
          fi
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 "${flags[@]}"

      - name: Download pinned AppImage tooling
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/appimage-tools"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimage-tools/linuxdeploy.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          printf '%s  %s\n' \
            c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d \
            "$RUNNER_TEMP/appimage-tools/linuxdeploy.AppImage" | sha256sum --check
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/appimage-tools/appimagetool.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          printf '%s  %s\n' \
            ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 \
            "$RUNNER_TEMP/appimage-tools/appimagetool.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimage-tools"/*.AppImage

      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimage-tools/appimagetool.AppImage
          LINUXDEPLOY: ${{ runner.temp }}/appimage-tools/linuxdeploy.AppImage
          OUTPUT_DIR: ${{ runner.temp }}/desktop-release
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir -p "$OUTPUT_DIR"
          apps/runtime-go/script/package-linux-appimage.sh

      - name: Smoke-test packaged Linux AppImage
        if: matrix.platform == 'linux'
        shell: bash
        env:
          AWSM_DESKTOP_BINARY: ${{ runner.temp }}/desktop-release/awsm-desktop-linux-x86_64-v${{ steps.metadata.outputs.version }}.AppImage
        run: node apps/runtime-go/script/packaged-desktop-smoke.mjs

      - name: Package Windows NSIS installer
        if: matrix.platform == 'windows'
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-release"
          installer=$(find apps/runtime-go/cmd/awsm/build/bin -maxdepth 1 -type f -iname '*-installer.exe' -print -quit)
          test -n "$installer"
          cp "$installer" "$RUNNER_TEMP/desktop-release/awsm-desktop-windows-x86_64-v$VERSION-setup.exe"

      - name: Package universal macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-release"
          app=$(find apps/runtime-go/cmd/awsm/build/bin -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"
          hdiutil create -volname AWSM -srcfolder "$app" -ov -format UDZO \
            "$RUNNER_TEMP/desktop-release/awsm-desktop-macos-universal-v$VERSION.dmg"

      - name: Verify desktop checksums
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ steps.metadata.outputs.version }}
          OUTPUT_DIR: ${{ runner.temp }}/desktop-release
        run: |
          if [[ "$PLATFORM" == "linux" ]]; then
            artifact="awsm-desktop-linux-x86_64-v$VERSION.AppImage"
          elif [[ "$PLATFORM" == "windows" ]]; then
            artifact="awsm-desktop-windows-x86_64-v$VERSION-setup.exe"
          else
            artifact="awsm-desktop-macos-universal-v$VERSION.dmg"
          fi
          test -s "$OUTPUT_DIR/$artifact"
          if command -v sha256sum >/dev/null 2>&1; then
            (
              cd "$OUTPUT_DIR"
              sha256sum "$artifact" > "$artifact.sha256"
              sha256sum --check "$artifact.sha256"
            )
          else
            (
              cd "$OUTPUT_DIR"
              shasum -a 256 "$artifact" > "$artifact.sha256"
              shasum -a 256 -c "$artifact.sha256"
            )
          fi

      - name: Upload desktop release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.platform }}-${{ github.ref_name }}
          path: ${{ runner.temp }}/desktop-release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  sign-firefox-candidate:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'sign-firefox-candidate' && vars.FIREFOX_AMO_SIGNING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Download validated browser release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-extension-inputs-${{ needs.build.outputs.tag }}
          path: dist

      - name: Validate resumable candidate run
        if: inputs.resume_run_id != ''
        env:
          CANDIDATE_COMMIT: ${{ needs.build.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: node apps/browser-extension/scripts/firefox-proof-status.mjs validate-resume

      - name: Restore resumable AMO upload identity
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firefox-amo-submission-v${{ needs.build.outputs.version }}-${{ needs.build.outputs.commit }}
          path: amo-resume
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Reproduce and verify the exact unsigned Firefox package
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          corepack pnpm --filter @awsm/browser-extension zip:firefox
          cmp \
            "apps/browser-extension/.output/awsmbrowser-extension-$VERSION-firefox.zip" \
            "dist/awsm-firefox-unsigned-v$VERSION.zip"
          if [[ -f amo-resume/.amo-upload-uuid ]]; then
            cp amo-resume/.amo-upload-uuid apps/browser-extension/.output/firefox-mv3/.amo-upload-uuid
          fi

      - name: Submit or resume exact unlisted AMO version
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ needs.build.outputs.version }}
          FIREFOX_SOURCE_NAME: ${{ needs.build.outputs.firefox_source_name }}
        run: |
          node apps/browser-extension/scripts/sign-firefox-unlisted.mjs \
            apps/browser-extension/.output/firefox-mv3 \
            "dist/$FIREFOX_SOURCE_NAME" \
            dist \
            '{f6f49704-8d53-4eda-aef7-619ab88dda5f}' \
            "$VERSION"

      - name: Preserve non-secret AMO upload identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-amo-submission-v${{ needs.build.outputs.version }}-${{ needs.build.outputs.commit }}
          path: apps/browser-extension/.output/firefox-mv3/.amo-upload-uuid
          if-no-files-found: ignore
          include-hidden-files: true
          overwrite: true
          retention-days: 30

      - name: Validate signed XPI and create candidate provenance
        env:
          CANDIDATE_COMMIT: ${{ needs.build.outputs.commit }}
          CANDIDATE_PROVENANCE: dist/firefox-candidate-v${{ needs.build.outputs.version }}.json
          CANDIDATE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FIREFOX_CHECKSUM_NAME: ${{ needs.build.outputs.firefox_checksum_name }}
          FIREFOX_SOURCE_ARCHIVE: dist/${{ needs.build.outputs.firefox_source_name }}
          FIREFOX_XPI: dist/${{ needs.build.outputs.firefox_xpi_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UNSIGNED_ARCHIVE: dist/awsm-firefox-unsigned-v${{ needs.build.outputs.version }}.zip
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          node apps/browser-extension/scripts/verify-signed-firefox-xpi.mjs \
            "$FIREFOX_XPI" \
            "$UNSIGNED_ARCHIVE"
          cd dist
          sha256sum "$(basename "$FIREFOX_XPI")" > "$FIREFOX_CHECKSUM_NAME"
          sha256sum --check "$FIREFOX_CHECKSUM_NAME"
          cd ..
          node apps/browser-extension/scripts/firefox-candidate-provenance.mjs create
          node apps/browser-extension/scripts/firefox-candidate-provenance.mjs verify

      - name: Upload signed Firefox candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firefox-candidate-v${{ needs.build.outputs.version }}-${{ needs.build.outputs.commit }}
          path: |
            dist/${{ needs.build.outputs.firefox_xpi_name }}
            dist/${{ needs.build.outputs.firefox_checksum_name }}
            dist/firefox-candidate-v${{ needs.build.outputs.version }}.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  reject-disabled-firefox-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'sign-firefox-candidate' && vars.FIREFOX_AMO_SIGNING_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require the protected Firefox signing gate
        run: |
          echo "FIREFOX_AMO_SIGNING_ENABLED must be exactly true for candidate signing." >&2
          exit 1

  publish-chrome:
    needs: [build, desktop-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.FIREFOX_AMO_SIGNING_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download validated Chrome release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-extension-inputs-${{ needs.build.outputs.tag }}
          path: dist

      - name: Revalidate transferred Chrome assets
        env:
          ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
          CHECKSUM_NAME: ${{ needs.build.outputs.checksum_name }}
        run: |
          cd dist
          sha256sum --check "$CHECKSUM_NAME"
          unzip -t "$ARCHIVE_NAME"
          if [[ "$(unzip -Z1 "$ARCHIVE_NAME" | grep -Fxc 'manifest.json')" -ne 1 ]]; then
            echo "Archive must contain exactly one root manifest.json" >&2
            exit 1
          fi

      - name: Download validated desktop release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*-${{ needs.build.outputs.tag }}
          path: dist
          merge-multiple: true

      - name: Revalidate transferred desktop assets
        env:
          DESKTOP_LINUX_NAME: ${{ needs.build.outputs.desktop_linux_name }}
          DESKTOP_LINUX_CHECKSUM_NAME: ${{ needs.build.outputs.desktop_linux_checksum_name }}
          DESKTOP_WINDOWS_NAME: ${{ needs.build.outputs.desktop_windows_name }}
          DESKTOP_WINDOWS_CHECKSUM_NAME: ${{ needs.build.outputs.desktop_windows_checksum_name }}
          DESKTOP_MACOS_NAME: ${{ needs.build.outputs.desktop_macos_name }}
          DESKTOP_MACOS_CHECKSUM_NAME: ${{ needs.build.outputs.desktop_macos_checksum_name }}
        run: |
          cd dist
          for checksum in "$DESKTOP_LINUX_CHECKSUM_NAME" "$DESKTOP_WINDOWS_CHECKSUM_NAME" "$DESKTOP_MACOS_CHECKSUM_NAME"; do
            test -s "$checksum"
            sha256sum --check "$checksum"
          done
          for artifact in "$DESKTOP_LINUX_NAME" "$DESKTOP_WINDOWS_NAME" "$DESKTOP_MACOS_NAME"; do
            test -s "$artifact"
          done

      - name: Publish Chrome GitHub Release
        env:
          ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
          CHECKSUM_NAME: ${{ needs.build.outputs.checksum_name }}
          DESKTOP_LINUX_CHECKSUM_NAME: ${{ needs.build.outputs.desktop_linux_checksum_name }}
          DESKTOP_LINUX_NAME: ${{ needs.build.outputs.desktop_linux_name }}
          DESKTOP_MACOS_CHECKSUM_NAME: ${{ needs.build.outputs.desktop_macos_checksum_name }}
          DESKTOP_MACOS_NAME: ${{ needs.build.outputs.desktop_macos_name }}
          DESKTOP_WINDOWS_CHECKSUM_NAME: ${{ needs.build.outputs.desktop_windows_checksum_name }}
          DESKTOP_WINDOWS_NAME: ${{ needs.build.outputs.desktop_windows_name }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          prerelease_args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$TAG" \
            "dist/$ARCHIVE_NAME" \
            "dist/$CHECKSUM_NAME" \
            "dist/$DESKTOP_LINUX_NAME" \
            "dist/$DESKTOP_LINUX_CHECKSUM_NAME" \
            "dist/$DESKTOP_WINDOWS_NAME" \
            "dist/$DESKTOP_WINDOWS_CHECKSUM_NAME" \
            "dist/$DESKTOP_MACOS_NAME" \
            "dist/$DESKTOP_MACOS_CHECKSUM_NAME" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --notes "$(cat dist/chrome-release-notes.md)" \
            --fail-on-no-commits \
            "${prerelease_args[@]}"

  publish-joint:
    needs: [build, desktop-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.FIREFOX_AMO_SIGNING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      statuses: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Resolve exact local signed proof
        id: proof
        env:
          CANDIDATE_COMMIT: ${{ needs.build.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node apps/browser-extension/scripts/firefox-proof-status.mjs resolve-proof

      - name: Download validated release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-extension-inputs-${{ needs.build.outputs.tag }}
          path: dist

      - name: Download exact locally proven Firefox candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: firefox-candidate-v${{ needs.build.outputs.version }}-${{ needs.build.outputs.commit }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.proof.outputs.run_id }}

      - name: Download validated desktop release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*-${{ needs.build.outputs.tag }}
          path: dist
          merge-multiple: true

      - name: Revalidate transferred assets and candidate provenance
        env:
          ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
          CANDIDATE_COMMIT: ${{ needs.build.outputs.commit }}
          CANDIDATE_PROVENANCE: dist/firefox-candidate-v${{ needs.build.outputs.version }}.json
          CANDIDATE_RUN_URL: ${{ steps.proof.outputs.run_url }}
          CHECKSUM_NAME: ${{ needs.build.outputs.checksum_name }}
          FIREFOX_CHECKSUM_NAME: ${{ needs.build.outputs.firefox_checksum_name }}
          FIREFOX_SOURCE_ARCHIVE: dist/${{ needs.build.outputs.firefox_source_name }}
          FIREFOX_XPI: dist/${{ needs.build.outputs.firefox_xpi_name }}
          DESKTOP_LINUX_CHECKSUM_NAME: ${{ needs.build.outputs.desktop_linux_checksum_name }}
          DESKTOP_LINUX_NAME: ${{ needs.build.outputs.desktop_linux_name }}
          DESKTOP_MACOS_CHECKSUM_NAME: ${{ needs.build.outputs.desktop_macos_checksum_name }}
          DESKTOP_MACOS_NAME: ${{ needs.build.outputs.desktop_macos_name }}
          DESKTOP_WINDOWS_CHECKSUM_NAME: ${{ needs.build.outputs.desktop_windows_checksum_name }}
          DESKTOP_WINDOWS_NAME: ${{ needs.build.outputs.desktop_windows_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UNSIGNED_ARCHIVE: dist/awsm-firefox-unsigned-v${{ needs.build.outputs.version }}.zip
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          node apps/browser-extension/scripts/firefox-candidate-provenance.mjs verify
          node apps/browser-extension/scripts/verify-signed-firefox-xpi.mjs \
            "$FIREFOX_XPI" \
            "$UNSIGNED_ARCHIVE"
          cd dist
          sha256sum --check "$CHECKSUM_NAME"
          sha256sum --check "$FIREFOX_CHECKSUM_NAME"
          sha256sum --check "$DESKTOP_LINUX_CHECKSUM_NAME"
          sha256sum --check "$DESKTOP_WINDOWS_CHECKSUM_NAME"
          sha256sum --check "$DESKTOP_MACOS_CHECKSUM_NAME"
          unzip -t "$ARCHIVE_NAME"
          unzip -t "$(basename "$FIREFOX_XPI")"
          if [[ "$(unzip -Z1 "$ARCHIVE_NAME" | grep -Fxc 'manifest.json')" -ne 1 ]]; then
            echo "Archive must contain exactly one root manifest.json" >&2
            exit 1
          fi

      - name: Publish joint GitHub Release
        env:
          ARCHIVE_NAME: ${{ needs.build.outputs.archive_name }}
          CHECKSUM_NAME: ${{ needs.build.outputs.checksum_name }}
          FIREFOX_CHECKSUM_NAME: ${{ needs.build.outputs.firefox_checksum_name }}
          FIREFOX_XPI_NAME: ${{ needs.build.outputs.firefox_xpi_name }}
          DESKTOP_LINUX_CHECKSUM_NAME: ${{ needs.build.outputs.desktop_linux_checksum_name }}
          DESKTOP_LINUX_NAME: ${{ needs.build.outputs.desktop_linux_name }}
          DESKTOP_MACOS_CHECKSUM_NAME: ${{ needs.build.outputs.desktop_macos_checksum_name }}
          DESKTOP_MACOS_NAME: ${{ needs.build.outputs.desktop_macos_name }}
          DESKTOP_WINDOWS_CHECKSUM_NAME: ${{ needs.build.outputs.desktop_windows_checksum_name }}
          DESKTOP_WINDOWS_NAME: ${{ needs.build.outputs.desktop_windows_name }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          prerelease_args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$TAG" \
            "dist/$ARCHIVE_NAME" \
            "dist/$CHECKSUM_NAME" \
            "dist/$FIREFOX_XPI_NAME" \
            "dist/$FIREFOX_CHECKSUM_NAME" \
            "dist/$DESKTOP_LINUX_NAME" \
            "dist/$DESKTOP_LINUX_CHECKSUM_NAME" \
            "dist/$DESKTOP_WINDOWS_NAME" \
            "dist/$DESKTOP_WINDOWS_CHECKSUM_NAME" \
            "dist/$DESKTOP_MACOS_NAME" \
            "dist/$DESKTOP_MACOS_CHECKSUM_NAME" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --notes "$(cat dist/release-notes.md)" \
            --fail-on-no-commits \
            "${prerelease_args[@]}"
