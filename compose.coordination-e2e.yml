name: awsm-coordination-e2e

services:
  postgres-coordination-e2e:
    image: postgres:17
    environment:
      POSTGRES_DB: coordination_server_e2e
      POSTGRES_PASSWORD: coordination-e2e-only
      POSTGRES_USER: coordination_e2e
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U coordination_e2e -d coordination_server_e2e",
        ]
      interval: 2s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  redis-coordination-e2e:
    image: redis:8.2.8-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
    tmpfs:
      - /data

  coordination-e2e-prepare:
    build:
      context: .
      dockerfile: apps/coordination-server/Dockerfile.proof
    command: ["bin/rails", "db:prepare"]
    depends_on:
      postgres-coordination-e2e:
        condition: service_healthy
      redis-coordination-e2e:
        condition: service_healthy
    environment: &coordination-e2e-environment
      AWSM_CABLE_ADAPTER: redis
      AWSM_JOB_QUEUE_ADAPTER: async
      AWSM_OPENAPI_PATH: /docs/specifications/protocol/http-api.openapi.yaml
      AWSM_OPAQUE_STORAGE_PATH: /opaque-storage
      AWSM_REDIS_NAMESPACE: awsm:coordination-e2e
      AWSM_REDIS_URL: redis://redis-coordination-e2e:6379/0
      AWSM_SYNTHETIC_ACCOUNT_SECRET: awsm-coordination-e2e-synthetic-account-parameter-secret
      AWSM_SYNC_PROOF: "true"
      RAILS_ENV: test
      TEST_DATABASE_URL: postgresql://coordination_e2e:coordination-e2e-only@postgres-coordination-e2e:5432/coordination_server_e2e
    volumes:
      - opaque-coordination-e2e-data:/opaque-storage

  coordination-e2e: &coordination-e2e
    build:
      context: .
      dockerfile: apps/coordination-server/Dockerfile.proof
    command: ["bin/rails", "server", "--binding", "0.0.0.0", "--port", "3000"]
    depends_on:
      coordination-e2e-prepare:
        condition: service_completed_successfully
    environment:
      <<: *coordination-e2e-environment
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/ready"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:${AWSM_COORDINATION_E2E_PRIMARY_PORT:-3310}:3000"
    volumes:
      - opaque-coordination-e2e-data:/opaque-storage

  coordination-e2e-peer:
    <<: *coordination-e2e
    ports:
      - "127.0.0.1:${AWSM_COORDINATION_E2E_PEER_PORT:-3311}:3000"

volumes:
  opaque-coordination-e2e-data:
