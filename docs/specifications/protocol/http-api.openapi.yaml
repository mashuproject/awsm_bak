openapi: 3.0.3
info:
  title: AWSM Coordination HTTP API
  version: "1"
  description: >-
    Canonical pre-release HTTPS adapter for the transport-independent AWSM synchronization
    protocol. Opaque payload bytes are never described semantically by this contract.
servers:
  - url: /
security:
  - accountBearer: []
paths:
  /api/server-information:
    get:
      operationId: getServerInformation
      security: []
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Coordination Server identity and supported pre-release capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInformation"
        default:
          $ref: "#/components/responses/Outcome"
  /api/sessions:
    post:
      operationId: createSession
      security: []
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Authenticated Account session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        default:
          $ref: "#/components/responses/Outcome"
  /api/session/refresh:
    post:
      operationId: refreshSession
      security: []
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: Rotated authenticated Account session credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        default:
          $ref: "#/components/responses/Outcome"
  /api/session:
    delete:
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "204":
          description: Current Account session revoked
        default:
          $ref: "#/components/responses/Outcome"
  /api/cable-tickets:
    post:
      operationId: createCableTicket
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "201":
          description: One-use short-lived Action Cable connection ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CableTicket"
        default:
          $ref: "#/components/responses/Outcome"
  /api/service-policy:
    get:
      operationId: getServicePolicy
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Effective Coordination Server policy
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePolicy"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults:
    get:
      operationId: listVaults
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Zero or one Account-owned Vault
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultList"
        default:
          $ref: "#/components/responses/Outcome"
    post:
      operationId: attachVault
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachVaultRequest"
      responses:
        "201":
          description: Provisional Vault and current active Generation upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachVaultResponse"
        default:
          $ref: "#/components/responses/Outcome"
  /api/account/vault-enrollment:
    get:
      operationId: getAccountVaultEnrollment
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Account enrollment state and active encrypted Recovery Kit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountVaultEnrollment"
        default:
          $ref: "#/components/responses/Outcome"
  /api/device-session-challenges:
    post:
      operationId: createDeviceSessionChallenge
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceSessionChallengeRequest"
      responses:
        "201":
          description: One-use Device authentication challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSessionChallenge"
        default:
          $ref: "#/components/responses/Outcome"
  /api/device-sessions:
    post:
      operationId: createDeviceSession
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceSessionRequest"
      responses:
        "200":
          description: VaultDevice-scoped API session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getVault
      responses:
        "200":
          description: Account-owned Vault replica state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/complete:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: completeVault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteVaultRequest"
      responses:
        "200":
          description: Active Vault replica
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/devices:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: listVaultDevices
      responses:
        "200":
          description: Public Device certificate facts for the bound Vault
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultDeviceList"
        default:
          $ref: "#/components/responses/Outcome"
    post:
      operationId: enrollVaultDevice
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollVaultDeviceRequest"
      responses:
        "201":
          description: Certified Device enrollment and VaultDevice-scoped API session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/devices/{deviceId}:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - name: deviceId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Uuid"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
    delete:
      operationId: removeVaultDevice
      responses:
        "204":
          description: Device authority removed
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/device-authority:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getCurrentVaultDeviceAuthority
      responses:
        "200":
          description: Current certificate and active-epoch envelope for the authenticated Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentVaultDeviceAuthority"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/future-protections:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: protectFutureVaultContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FutureProtectionRequest"
      responses:
        "200":
          description: Vault authority after atomic recovery-generation and key-epoch rotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/replacement-candidates:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: createVaultReplacementCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVaultReplacementRequest"
      responses:
        "201":
          description: Provisional cryptographically independent replacement Vault
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachVaultResponse"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/replacement-candidates/{replacementVaultId}/activate:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - name: replacementVaultId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Uuid"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: activateVaultReplacement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateVaultReplacementRequest"
      responses:
        "202":
          description: Replacement activated and source purge scheduled without a Recovery Snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultReplacementActivation"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/uploads:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: createUpload
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Upload and transfer ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadWithTicket"
        "200":
          description: Existing matching durable Object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadWithTicket"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/uploads/{uploadId}:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/UploadId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getUpload
      responses:
        "200":
          description: Resumable upload state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/uploads/{uploadId}/ticket:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/UploadId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: renewUploadTicket
      responses:
        "200":
          description: Fresh scoped upload ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferTicket"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/uploads/{uploadId}/complete:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/UploadId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: completeUpload
      responses:
        "200":
          description: Durable uncommitted Object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpaqueRecord"
        default:
          $ref: "#/components/responses/Outcome"
  /api/transfers/{ticket}/parts/{partNumber}:
    parameters:
      - $ref: "#/components/parameters/TransferToken"
      - $ref: "#/components/parameters/PartNumber"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
    put:
      operationId: putUploadPart
      security: []
      parameters:
        - $ref: "#/components/parameters/ContentSha256"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Part accepted idempotently
        default:
          $ref: "#/components/responses/Outcome"
  /api/transfers/{ticket}:
    parameters:
      - $ref: "#/components/parameters/TransferToken"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: downloadOpaqueRecord
      security: []
      parameters:
        - in: header
          name: Range
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Complete opaque bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: One byte range
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/commits:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: commitEventClosure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRequest"
      responses:
        "200":
          description: Durable Event closure publication or already-active closure acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitResult"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/records:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: listActiveRecords
      parameters:
        - $ref: "#/components/parameters/AfterObjectId"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Active Generation record page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPage"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/changes:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: listChanges
      parameters:
        - in: query
          name: after
          required: true
          schema:
            $ref: "#/components/schemas/Counter"
        - $ref: "#/components/parameters/Limit"
        - in: query
          name: generationId
          required: false
          schema:
            $ref: "#/components/schemas/Uuid"
        - in: query
          name: snapshot
          required: false
          description: Cursor fence returned by the first page; repeat it on later pages.
          schema:
            $ref: "#/components/schemas/Counter"
      responses:
        "200":
          description: Snapshot-bounded delivery changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/records/{objectId}/downloads:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/ObjectId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: createActiveDownload
      responses:
        "200":
          description: Active-record download ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadTicket"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/generation-candidates:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: createGenerationCandidate
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGenerationCandidateRequest"
      responses:
        "201":
          description: Inactive Generation candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationCandidate"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/generation-candidates/{generationId}:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/GenerationId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/IdempotencyKey"
    delete:
      operationId: discardGenerationCandidate
      responses:
        "204":
          description: Candidate discarded
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/generation-candidates/{generationId}/retained-pages/{pageNumber}:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/GenerationId"
      - $ref: "#/components/parameters/PageNumber"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/IdempotencyKey"
    put:
      operationId: putGenerationRetainedPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetainedPageRequest"
      responses:
        "204":
          description: Retained page accepted idempotently
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/generation-candidates/{generationId}/seal:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/GenerationId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: sealGenerationCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SealGenerationCandidateRequest"
      responses:
        "200":
          description: Sealed Generation candidate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationCandidate"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/generation-candidates/{generationId}/activate:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/GenerationId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: activateGenerationCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateGenerationRequest"
      responses:
        "200":
          description: Activated successor Generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vault"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/recoveries:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: listRecoveries
      responses:
        "200":
          description: Superseded Generation recovery snapshots
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recoveries]
                properties:
                  recoveries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Recovery"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/recoveries/{generationId}/records:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/GenerationId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: listRecoveryRecords
      parameters:
        - $ref: "#/components/parameters/AfterObjectId"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Exact superseded Generation record page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPage"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/recoveries/{generationId}/records/{objectId}/downloads:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/GenerationId"
      - $ref: "#/components/parameters/ObjectId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
      - $ref: "#/components/parameters/IdempotencyKey"
    post:
      operationId: createRecoveryDownload
      responses:
        "200":
          description: Recovery-scoped download ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadTicket"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/purges:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: createPurge
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Durable purge Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purge"
        default:
          $ref: "#/components/responses/Outcome"
  /api/vaults/{vaultId}/purges/{purgeId}:
    parameters:
      - $ref: "#/components/parameters/VaultId"
      - $ref: "#/components/parameters/PurgeId"
      - $ref: "#/components/parameters/ProtocolVersion"
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getPurge
      responses:
        "200":
          description: Purge Job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Purge"
        default:
          $ref: "#/components/responses/Outcome"
components:
  securitySchemes:
    accountBearer:
      type: http
      scheme: bearer
  headers:
    ProtocolVersion:
      required: true
      schema:
        type: string
        enum: ["1"]
    RequestId:
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
  parameters:
    ProtocolVersion:
      in: header
      name: Awsm-Protocol-Version
      required: true
      schema:
        type: string
        enum: ["1"]
    RequestId:
      in: header
      name: Awsm-Request-ID
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    VaultId:
      in: path
      name: vaultId
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    GenerationId:
      in: path
      name: generationId
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ObjectId:
      in: path
      name: objectId
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    UploadId:
      in: path
      name: uploadId
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    PurgeId:
      in: path
      name: purgeId
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    TransferToken:
      in: path
      name: ticket
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
    PartNumber:
      in: path
      name: partNumber
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 9999
    PageNumber:
      in: path
      name: pageNumber
      required: true
      schema:
        type: integer
        minimum: 0
    ContentSha256:
      in: header
      name: Content-SHA256
      required: true
      schema:
        $ref: "#/components/schemas/Sha256"
    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    AfterObjectId:
      in: query
      name: afterObjectId
      required: false
      schema:
        $ref: "#/components/schemas/Uuid"
  responses:
    Outcome:
      description: Stable protocol outcome
      headers:
        Awsm-Protocol-Version:
          $ref: "#/components/headers/ProtocolVersion"
        Awsm-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Outcome"
  schemas:
    ServerInformation:
      type: object
      additionalProperties: false
      required: [service, protocolVersion, capabilities, registration]
      properties:
        service:
          type: string
          enum: [AWSM Coordination Server]
        protocolVersion:
          type: string
          enum: ["1"]
        capabilities:
          type: object
          additionalProperties: false
          required:
            [
              accountPassword,
              accountVaultLimit,
              completeReplicaSynchronization,
              deviceEnrollment,
              deviceRevocation,
            ]
          properties:
            accountPassword:
              type: boolean
              enum: [true]
            accountVaultLimit:
              type: integer
              enum: [1]
            completeReplicaSynchronization:
              type: boolean
              enum: [true]
            deviceEnrollment:
              type: string
              enum: [RecoveryPhrase]
            deviceRevocation:
              type: boolean
              enum: [true]
        registration:
          oneOf:
            - type: object
              additionalProperties: false
              required: [enabled, signUpUrl]
              properties:
                enabled:
                  type: boolean
                  enum: [true]
                signUpUrl:
                  type: string
                  format: uri
            - type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                  enum: [false]
    Email:
      type: string
      minLength: 3
      maxLength: 254
      pattern: "^[^\\s@]+@[^\\s@]+$"
    Base64Url32:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"
    Base64Url16:
      type: string
      pattern: "^[A-Za-z0-9_-]{22}$"
    Base64Url24:
      type: string
      pattern: "^[A-Za-z0-9_-]{32}$"
    Base64Url48:
      type: string
      pattern: "^[A-Za-z0-9_-]{64}$"
    Base64Url64:
      type: string
      pattern: "^[A-Za-z0-9_-]{86}$"
    Base64UrlBytes:
      type: string
      minLength: 1
      pattern: "^[A-Za-z0-9_-]+$"
    AccountSummary:
      type: object
      additionalProperties: false
      required: [accountId, email]
      properties:
        accountId:
          $ref: "#/components/schemas/Uuid"
        email:
          $ref: "#/components/schemas/Email"
    CableTicket:
      type: object
      additionalProperties: false
      required: [ticket, expiresAt]
      properties:
        ticket:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
        expiresAt:
          type: string
          format: date-time
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          $ref: "#/components/schemas/Email"
        password:
          type: string
          minLength: 1
          maxLength: 72
    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 80
          maxLength: 96
    AuthenticatedSession:
      type: object
      additionalProperties: false
      required:
        - account
        - sessionId
        - scope
        - accessToken
        - accessExpiresAt
        - refreshToken
        - refreshExpiresAt
      properties:
        account:
          $ref: "#/components/schemas/AccountSummary"
        sessionId:
          $ref: "#/components/schemas/Uuid"
        scope:
          type: string
          enum: [Account, VaultDevice]
        accessToken:
          type: string
          minLength: 80
          maxLength: 96
        accessExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          minLength: 80
          maxLength: 96
        refreshExpiresAt:
          type: string
          format: date-time
    Uuid:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    Counter:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    PositiveByteLength:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    Sha256:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"
    ObjectType:
      type: string
      enum: [Event, BundleDescriptor, Artifact, VaultGeneration]
    ObjectMetadata:
      type: object
      additionalProperties: false
      required: [objectId, objectType, keyEpochId, byteLength, sha256]
      properties:
        objectId:
          $ref: "#/components/schemas/Uuid"
        objectType:
          $ref: "#/components/schemas/ObjectType"
        keyEpochId:
          $ref: "#/components/schemas/Uuid"
        byteLength:
          $ref: "#/components/schemas/PositiveByteLength"
        sha256:
          $ref: "#/components/schemas/Sha256"
    EventMetadata:
      type: object
      additionalProperties: false
      required: [orderingTimestamp, dependencyObjectIds]
      properties:
        orderingTimestamp:
          type: string
          format: date-time
        dependencyObjectIds:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"
    AttachVaultRequest:
      type: object
      additionalProperties: false
      required:
        [
          vaultId,
          generationId,
          generationNumber,
          generationObject,
          recoveryGeneration,
          keyEpoch,
          deviceCertificate,
          deviceKeyEnvelope,
          deviceProofSignature,
        ]
      properties:
        vaultId:
          $ref: "#/components/schemas/Uuid"
        generationId:
          $ref: "#/components/schemas/Uuid"
        generationNumber:
          $ref: "#/components/schemas/Counter"
        generationObject:
          $ref: "#/components/schemas/ObjectMetadata"
        recoveryGeneration:
          $ref: "#/components/schemas/RecoveryKit"
        keyEpoch:
          $ref: "#/components/schemas/InitialKeyEpoch"
        deviceCertificate:
          $ref: "#/components/schemas/DeviceCertificate"
        deviceKeyEnvelope:
          $ref: "#/components/schemas/DeviceKeyEnvelope"
        deviceProofSignature:
          $ref: "#/components/schemas/Base64Url64"
    AccountVaultEnrollment:
      oneOf:
        - type: object
          additionalProperties: false
          required: [state]
          properties:
            state:
              type: string
              enum: [Empty]
        - type: object
          additionalProperties: false
          required: [state, vaultId, recoveryKit]
          properties:
            state:
              type: string
              enum: [Attached]
            vaultId:
              $ref: "#/components/schemas/Uuid"
            recoveryKit:
              $ref: "#/components/schemas/RecoveryKit"
    DeviceSessionChallengeRequest:
      type: object
      additionalProperties: false
      required: [vaultId, deviceId]
      properties:
        vaultId:
          $ref: "#/components/schemas/Uuid"
        deviceId:
          $ref: "#/components/schemas/Uuid"
    DeviceSessionChallenge:
      type: object
      additionalProperties: false
      required: [challenge, expiresAt]
      properties:
        challenge:
          $ref: "#/components/schemas/Base64Url32"
        expiresAt:
          type: string
          format: date-time
    CreateDeviceSessionRequest:
      type: object
      additionalProperties: false
      required: [vaultId, deviceId, challenge, signature]
      properties:
        vaultId:
          $ref: "#/components/schemas/Uuid"
        deviceId:
          $ref: "#/components/schemas/Uuid"
        challenge:
          $ref: "#/components/schemas/Base64Url32"
        signature:
          $ref: "#/components/schemas/Base64Url64"
    AttachVaultResponse:
      type: object
      additionalProperties: false
      required: [vault, upload, ticket, session]
      properties:
        vault:
          $ref: "#/components/schemas/Vault"
        upload:
          $ref: "#/components/schemas/Upload"
        ticket:
          $ref: "#/components/schemas/TransferTicket"
        session:
          $ref: "#/components/schemas/AuthenticatedSession"
    CreateVaultReplacementRequest:
      type: object
      additionalProperties: false
      required:
        [
          accountSessionId,
          expectedSourceGenerationId,
          expectedSourceGenerationNumber,
          expectedSourceHeadCursor,
          replacement,
        ]
      properties:
        accountSessionId:
          $ref: "#/components/schemas/Uuid"
        expectedSourceGenerationId:
          $ref: "#/components/schemas/Uuid"
        expectedSourceGenerationNumber:
          $ref: "#/components/schemas/Counter"
        expectedSourceHeadCursor:
          $ref: "#/components/schemas/Counter"
        replacement:
          $ref: "#/components/schemas/AttachVaultRequest"
    ActivateVaultReplacementRequest:
      type: object
      additionalProperties: false
      required:
        [
          expectedSourceGenerationId,
          expectedSourceGenerationNumber,
          expectedSourceHeadCursor,
          replacementGenerationId,
          replacementGenerationNumber,
        ]
      properties:
        expectedSourceGenerationId:
          $ref: "#/components/schemas/Uuid"
        expectedSourceGenerationNumber:
          $ref: "#/components/schemas/Counter"
        expectedSourceHeadCursor:
          $ref: "#/components/schemas/Counter"
        replacementGenerationId:
          $ref: "#/components/schemas/Uuid"
        replacementGenerationNumber:
          $ref: "#/components/schemas/Counter"
    VaultReplacementPurge:
      type: object
      additionalProperties: false
      required: [purgeId, state, stage, processedBytes, totalBytes]
      properties:
        purgeId:
          $ref: "#/components/schemas/Uuid"
        state:
          type: string
          enum: [Pending, Running, Succeeded, FailedRetryable]
        stage:
          type: string
          enum: [Detach, Analyze, DeleteBytes, Tombstone, Complete]
        processedBytes:
          $ref: "#/components/schemas/Counter"
        totalBytes:
          $ref: "#/components/schemas/Counter"
    VaultReplacementActivation:
      type: object
      additionalProperties: false
      required: [sourceVaultId, sourceState, vault, purge]
      properties:
        sourceVaultId:
          $ref: "#/components/schemas/Uuid"
        sourceState:
          type: string
          enum: [Replaced]
        vault:
          $ref: "#/components/schemas/Vault"
        purge:
          $ref: "#/components/schemas/VaultReplacementPurge"
    CompleteVaultRequest:
      type: object
      additionalProperties: false
      required: [generationId]
      properties:
        generationId:
          $ref: "#/components/schemas/Uuid"
    Vault:
      type: object
      additionalProperties: false
      required:
        [
          vaultId,
          state,
          generationId,
          generationNumber,
          headCursor,
          activeKeyEpochId,
        ]
      properties:
        vaultId:
          $ref: "#/components/schemas/Uuid"
        state:
          type: string
          enum: [Provisional, Active, Replaced]
        generationId:
          $ref: "#/components/schemas/Uuid"
        generationNumber:
          $ref: "#/components/schemas/Counter"
        predecessorGenerationId:
          $ref: "#/components/schemas/Uuid"
        headCursor:
          $ref: "#/components/schemas/Counter"
        activeKeyEpochId:
          $ref: "#/components/schemas/Uuid"
    VaultList:
      type: object
      additionalProperties: false
      required: [vaults]
      properties:
        vaults:
          type: array
          maxItems: 1
          items:
            $ref: "#/components/schemas/Vault"
    RecoveryKit:
      type: object
      additionalProperties: false
      required:
        [
          version,
          vaultId,
          recoveryGenerationId,
          derivationAlgorithm,
          wrappingAlgorithm,
          administratorSigningAlgorithm,
          administratorPublicKey,
          nonce,
          ciphertextLength,
          ciphertextSha256,
          ciphertext,
        ]
      properties:
        version:
          type: integer
          enum: [1]
        vaultId:
          $ref: "#/components/schemas/Uuid"
        recoveryGenerationId:
          $ref: "#/components/schemas/Uuid"
        derivationAlgorithm:
          type: string
          enum: ["kdf:hkdf-sha256:recovery-entropy:v1"]
        wrappingAlgorithm:
          type: string
          enum: ["wrap:xchacha20poly1305:recovery-kit:v1"]
        administratorSigningAlgorithm:
          type: string
          enum: ["sign:ed25519:recovery-administrator:v1"]
        administratorPublicKey:
          $ref: "#/components/schemas/Base64Url32"
        nonce:
          $ref: "#/components/schemas/Base64Url24"
        ciphertextLength:
          $ref: "#/components/schemas/PositiveByteLength"
        ciphertextSha256:
          $ref: "#/components/schemas/Sha256"
        ciphertext:
          $ref: "#/components/schemas/Base64UrlBytes"
    InitialKeyEpoch:
      type: object
      additionalProperties: false
      required: [keyEpochId, ordinal]
      properties:
        keyEpochId:
          $ref: "#/components/schemas/Uuid"
        ordinal:
          type: integer
          enum: [0]
    NextKeyEpoch:
      type: object
      additionalProperties: false
      required: [keyEpochId, ordinal]
      properties:
        keyEpochId:
          $ref: "#/components/schemas/Uuid"
        ordinal:
          type: integer
          minimum: 1
    DeviceCertificate:
      type: object
      additionalProperties: false
      required: [content, recoveryAdministratorPublicKey, signature]
      properties:
        content:
          $ref: "#/components/schemas/Base64UrlBytes"
        recoveryAdministratorPublicKey:
          $ref: "#/components/schemas/Base64Url32"
        signature:
          $ref: "#/components/schemas/Base64Url64"
    DeviceKeyEnvelope:
      type: object
      additionalProperties: false
      required: [metadata, ciphertext, ciphertextSha256, administratorSignature]
      properties:
        metadata:
          $ref: "#/components/schemas/Base64UrlBytes"
        ciphertext:
          $ref: "#/components/schemas/Base64Url48"
        ciphertextSha256:
          $ref: "#/components/schemas/Sha256"
        administratorSignature:
          $ref: "#/components/schemas/Base64Url64"
    EnrollVaultDeviceRequest:
      type: object
      additionalProperties: false
      required: [deviceCertificate, deviceKeyEnvelopes, deviceProofSignature]
      properties:
        deviceCertificate:
          $ref: "#/components/schemas/DeviceCertificate"
        deviceKeyEnvelopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DeviceKeyEnvelope"
        deviceProofSignature:
          $ref: "#/components/schemas/Base64Url64"
    FutureProtectionDevice:
      type: object
      additionalProperties: false
      required: [deviceCertificate, deviceKeyEnvelope]
      properties:
        deviceCertificate:
          $ref: "#/components/schemas/DeviceCertificate"
        deviceKeyEnvelope:
          $ref: "#/components/schemas/DeviceKeyEnvelope"
    FutureProtectionRequest:
      type: object
      additionalProperties: false
      required:
        [
          expectedRecoveryGenerationId,
          expectedKeyEpochId,
          targetDeviceId,
          recoveryGeneration,
          keyEpoch,
          remainingDevices,
        ]
      properties:
        expectedRecoveryGenerationId:
          $ref: "#/components/schemas/Uuid"
        expectedKeyEpochId:
          $ref: "#/components/schemas/Uuid"
        targetDeviceId:
          $ref: "#/components/schemas/Uuid"
        recoveryGeneration:
          $ref: "#/components/schemas/RecoveryKit"
        keyEpoch:
          $ref: "#/components/schemas/NextKeyEpoch"
        remainingDevices:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FutureProtectionDevice"
    CurrentVaultDeviceAuthority:
      type: object
      additionalProperties: false
      required:
        [
          vaultId,
          activeRecoveryGenerationId,
          activeKeyEpochId,
          keyEpochOrdinal,
          deviceCertificate,
          deviceKeyEnvelope,
        ]
      properties:
        vaultId:
          $ref: "#/components/schemas/Uuid"
        activeRecoveryGenerationId:
          $ref: "#/components/schemas/Uuid"
        activeKeyEpochId:
          $ref: "#/components/schemas/Uuid"
        keyEpochOrdinal:
          type: integer
          minimum: 0
        deviceCertificate:
          $ref: "#/components/schemas/DeviceCertificate"
        deviceKeyEnvelope:
          $ref: "#/components/schemas/DeviceKeyEnvelope"
    VaultDeviceList:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/VaultDevice"
    VaultDevice:
      type: object
      additionalProperties: false
      required:
        [
          deviceId,
          certificateId,
          displayName,
          clientKind,
          recoveryGenerationId,
          deviceCertificate,
          enrolledAt,
          current,
        ]
      properties:
        deviceId:
          $ref: "#/components/schemas/Uuid"
        certificateId:
          $ref: "#/components/schemas/Uuid"
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        clientKind:
          type: string
          enum: [ChromeExtension, FirefoxExtension]
        recoveryGenerationId:
          $ref: "#/components/schemas/Uuid"
        deviceCertificate:
          $ref: "#/components/schemas/DeviceCertificate"
        enrolledAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        revocationReason:
          type: string
          enum: [Removed, FutureProtection, VaultReencrypted]
        current:
          type: boolean
    CreateUploadRequest:
      allOf:
        - $ref: "#/components/schemas/ObjectMetadata"
        - type: object
          additionalProperties: false
          required:
            [objectId, objectType, byteLength, sha256, targetGenerationId]
          properties:
            objectId:
              $ref: "#/components/schemas/Uuid"
            objectType:
              $ref: "#/components/schemas/ObjectType"
            byteLength:
              $ref: "#/components/schemas/PositiveByteLength"
            sha256:
              $ref: "#/components/schemas/Sha256"
            targetGenerationId:
              $ref: "#/components/schemas/Uuid"
            eventMetadata:
              $ref: "#/components/schemas/EventMetadata"
    Upload:
      type: object
      additionalProperties: false
      required:
        [
          uploadId,
          objectId,
          state,
          partSizeBytes,
          partCount,
          receivedParts,
          expiresAt,
        ]
      properties:
        uploadId:
          $ref: "#/components/schemas/Uuid"
        objectId:
          $ref: "#/components/schemas/Uuid"
        state:
          type: string
          enum: [Open, Assembling, Completed, Expired, AlreadyDurable]
        partSizeBytes:
          $ref: "#/components/schemas/PositiveByteLength"
        partCount:
          type: integer
          minimum: 1
          maximum: 10000
        receivedParts:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 0
        expiresAt:
          type: string
          format: date-time
    UploadWithTicket:
      type: object
      additionalProperties: false
      required: [upload, ticket]
      properties:
        upload:
          $ref: "#/components/schemas/Upload"
        ticket:
          $ref: "#/components/schemas/TransferTicket"
    TransferTicket:
      type: object
      additionalProperties: false
      required: [method, url, expiresAt, requiredHeaders]
      properties:
        method:
          type: string
          enum: [GET, PUT]
        url:
          type: string
        urlTemplate:
          type: string
        expiresAt:
          type: string
          format: date-time
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
    OpaqueRecord:
      allOf:
        - $ref: "#/components/schemas/ObjectMetadata"
        - type: object
          additionalProperties: false
          required: [objectId, objectType, byteLength, sha256, state]
          properties:
            objectId:
              $ref: "#/components/schemas/Uuid"
            objectType:
              $ref: "#/components/schemas/ObjectType"
            byteLength:
              $ref: "#/components/schemas/PositiveByteLength"
            sha256:
              $ref: "#/components/schemas/Sha256"
            state:
              type: string
              enum: [DurableUncommitted, Committed]
            orderingTimestamp:
              type: string
              format: date-time
            dependencyObjectIds:
              type: array
              uniqueItems: true
              items:
                $ref: "#/components/schemas/Uuid"
    CommitRequest:
      type: object
      additionalProperties: false
      required:
        [generationId, generationNumber, eventObjectId, dependencyObjectIds]
      properties:
        generationId:
          $ref: "#/components/schemas/Uuid"
        generationNumber:
          $ref: "#/components/schemas/Counter"
        eventObjectId:
          $ref: "#/components/schemas/Uuid"
        dependencyObjectIds:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"
    CommitResult:
      type: object
      additionalProperties: false
      required:
        [
          eventObjectId,
          generationId,
          generationNumber,
          dependencyObjectIds,
          cursor,
          durabilityAcknowledged,
        ]
      properties:
        eventObjectId:
          $ref: "#/components/schemas/Uuid"
        generationId:
          $ref: "#/components/schemas/Uuid"
        generationNumber:
          $ref: "#/components/schemas/Counter"
        dependencyObjectIds:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
        cursor:
          $ref: "#/components/schemas/Counter"
        durabilityAcknowledged:
          type: boolean
          enum: [true]
    RecordPage:
      type: object
      additionalProperties: false
      required: [generationId, generationNumber, records, hasMore]
      properties:
        generationId:
          $ref: "#/components/schemas/Uuid"
        generationNumber:
          $ref: "#/components/schemas/Counter"
        records:
          type: array
          items:
            $ref: "#/components/schemas/OpaqueRecord"
        nextObjectId:
          $ref: "#/components/schemas/Uuid"
        hasMore:
          type: boolean
    Change:
      type: object
      additionalProperties: false
      required: [cursor, kind, generationId, acceptedAt]
      properties:
        cursor:
          $ref: "#/components/schemas/Counter"
        kind:
          type: string
          enum: [EventCommitted, GenerationActivated]
        generationId:
          $ref: "#/components/schemas/Uuid"
        event:
          $ref: "#/components/schemas/OpaqueRecord"
        acceptedAt:
          type: string
          format: date-time
    ChangePage:
      type: object
      additionalProperties: false
      required:
        [
          generationId,
          generationNumber,
          changes,
          nextCursor,
          snapshotCursor,
          hasMore,
        ]
      properties:
        generationId:
          $ref: "#/components/schemas/Uuid"
        generationNumber:
          $ref: "#/components/schemas/Counter"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
        nextCursor:
          $ref: "#/components/schemas/Counter"
        snapshotCursor:
          $ref: "#/components/schemas/Counter"
        hasMore:
          type: boolean
    DownloadTicket:
      type: object
      additionalProperties: false
      required: [record, ticket]
      properties:
        record:
          $ref: "#/components/schemas/OpaqueRecord"
        ticket:
          $ref: "#/components/schemas/TransferTicket"
    CreateGenerationCandidateRequest:
      type: object
      additionalProperties: false
      required:
        [
          generationId,
          generationNumber,
          predecessorGenerationId,
          headCursor,
          generationObject,
        ]
      properties:
        generationId:
          $ref: "#/components/schemas/Uuid"
        generationNumber:
          $ref: "#/components/schemas/Counter"
        predecessorGenerationId:
          $ref: "#/components/schemas/Uuid"
        headCursor:
          $ref: "#/components/schemas/Counter"
        generationObject:
          $ref: "#/components/schemas/ObjectMetadata"
    GenerationCandidate:
      type: object
      additionalProperties: false
      required:
        [
          generationId,
          generationNumber,
          predecessorGenerationId,
          baselineCursor,
          state,
        ]
      properties:
        generationId:
          $ref: "#/components/schemas/Uuid"
        generationNumber:
          $ref: "#/components/schemas/Counter"
        predecessorGenerationId:
          $ref: "#/components/schemas/Uuid"
        baselineCursor:
          $ref: "#/components/schemas/Counter"
        state:
          type: string
          enum: [Candidate, Sealed]
        upload:
          $ref: "#/components/schemas/Upload"
        ticket:
          $ref: "#/components/schemas/TransferTicket"
    RetainedPageRequest:
      type: object
      additionalProperties: false
      required: [recordIds]
      properties:
        recordIds:
          type: array
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"
    SealGenerationCandidateRequest:
      type: object
      additionalProperties: false
      required: [pageCount, recordCount, sha256]
      properties:
        pageCount:
          type: integer
          minimum: 0
        recordCount:
          $ref: "#/components/schemas/Counter"
        sha256:
          $ref: "#/components/schemas/Sha256"
    ActivateGenerationRequest:
      type: object
      additionalProperties: false
      required:
        [predecessorGenerationId, predecessorGenerationNumber, headCursor]
      properties:
        predecessorGenerationId:
          $ref: "#/components/schemas/Uuid"
        predecessorGenerationNumber:
          $ref: "#/components/schemas/Counter"
        headCursor:
          $ref: "#/components/schemas/Counter"
    Recovery:
      type: object
      additionalProperties: false
      required:
        [
          generationId,
          generationNumber,
          supersededAt,
          purgeAfter,
          state,
          recordCount,
          byteLength,
        ]
      properties:
        generationId:
          $ref: "#/components/schemas/Uuid"
        generationNumber:
          $ref: "#/components/schemas/Counter"
        supersededAt:
          type: string
          format: date-time
        purgeAfter:
          type: string
          format: date-time
        state:
          type: string
          enum: [Superseded, Purging]
        recordCount:
          $ref: "#/components/schemas/Counter"
        byteLength:
          $ref: "#/components/schemas/Counter"
    Purge:
      type: object
      additionalProperties: false
      required:
        [
          purgeId,
          state,
          stage,
          generationCount,
          recordCount,
          processedBytes,
          totalBytes,
          retryCount,
        ]
      properties:
        purgeId:
          $ref: "#/components/schemas/Uuid"
        state:
          type: string
          enum: [Pending, Running, Succeeded, FailedRetryable]
        stage:
          type: string
          enum: [Snapshot, Detach, Analyze, DeleteBytes, Tombstone, Complete]
        generationCount:
          $ref: "#/components/schemas/Counter"
        recordCount:
          $ref: "#/components/schemas/Counter"
        processedBytes:
          $ref: "#/components/schemas/Counter"
        totalBytes:
          $ref: "#/components/schemas/Counter"
        retryCount:
          $ref: "#/components/schemas/Counter"
        outcome:
          type: string
    Outcome:
      type: object
      additionalProperties: false
      required: [outcome, retryable, requestId]
      properties:
        outcome:
          type: string
          enum:
            - AUTHENTICATION_FAILED
            - AUTHENTICATION_UNAVAILABLE
            - ACCOUNT_UNAVAILABLE
            - ACCOUNT_INPUT_INVALID
            - RECENT_AUTHENTICATION_REQUIRED
            - AUTHORIZATION_FAILED
            - PROTOCOL_VERSION_UNSUPPORTED
            - REQUEST_INVALID
            - IDEMPOTENCY_CONFLICT
            - ACCOUNT_VAULT_LIMIT
            - VAULT_ID_UNAVAILABLE
            - VAULT_NOT_FOUND
            - VAULT_NOT_READY
            - RECOVERY_GENERATION_CHANGED
            - KEY_EPOCH_CHANGED
            - DEVICE_REVOKED
            - DEVICE_ENROLLMENT_INVALID
            - VAULT_REPLACEMENT_CONFLICT
            - OBJECT_ID_CONFLICT
            - OBJECT_NOT_DURABLE
            - OBJECT_NOT_ACTIVE
            - OBJECT_CHECKSUM_MISMATCH
            - OBJECT_LENGTH_MISMATCH
            - UPLOAD_EXPIRED
            - UPLOAD_PART_CONFLICT
            - TRANSFER_TICKET_INVALID
            - DEPENDENCY_INVALID
            - VAULT_GENERATION_SUPERSEDED
            - VAULT_HEAD_CHANGED
            - GENERATION_CANDIDATE_CONFLICT
            - GENERATION_REACHABILITY_INVALID
            - RECOVERY_NOT_FOUND
            - RECOVERY_EXPIRED
            - PURGE_IN_PROGRESS
            - SERVER_BUSY
            - STORAGE_UNAVAILABLE
        retryable:
          type: boolean
        requestId:
          $ref: "#/components/schemas/Uuid"
        retryAfterSeconds:
          type: integer
          minimum: 0
        relatedObjectId:
          $ref: "#/components/schemas/Uuid"
        currentGenerationId:
          $ref: "#/components/schemas/Uuid"
        currentGenerationNumber:
          $ref: "#/components/schemas/Counter"
        headCursor:
          $ref: "#/components/schemas/Counter"
    ServicePolicy:
      type: object
      additionalProperties: false
      required:
        - recoveryRetentionDays
        - uploadStagingExpiryHours
        - transferTicketLifetimeSeconds
        - uploadPartSizeBytes
        - maximumUploadParts
        - maximumObjectByteLength
        - maximumChangesPageSize
        - maximumRecordPageSize
        - notifications
      properties:
        recoveryRetentionDays:
          type: integer
          minimum: 0
          maximum: 36500
        uploadStagingExpiryHours:
          type: integer
          minimum: 1
        transferTicketLifetimeSeconds:
          type: integer
          minimum: 1
        uploadPartSizeBytes:
          type: integer
          minimum: 1
        maximumUploadParts:
          type: integer
          minimum: 1
          maximum: 10000
        maximumObjectByteLength:
          $ref: "#/components/schemas/PositiveByteLength"
        maximumChangesPageSize:
          type: integer
          minimum: 1
          maximum: 500
        maximumRecordPageSize:
          type: integer
          minimum: 1
          maximum: 500
        notifications:
          type: object
          additionalProperties: false
          required: [actionCable]
          properties:
            actionCable:
              type: boolean
    VaultChangeHint:
      type: object
      additionalProperties: false
      required: [vaultId, latestCursor]
      properties:
        vaultId:
          $ref: "#/components/schemas/Uuid"
        latestCursor:
          $ref: "#/components/schemas/Counter"
