openapi: 3.0.3
info:
  title: AWSM Replica Host HTTP API
  version: "1"
  description: >-
    Canonical pre-release HTTPS adapter for Host-local Accounts, Channel Principals, capability
    Grants, and opaque Hosted Replica storage. This contract exposes no protected Vault semantics.
servers:
  - url: /
security:
  - accountBearer: []
paths:
  /api/server-information:
    get:
      operationId: getServerInformation
      security: []
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Replica Host identity and supported operations
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInformation"
        default:
          $ref: "#/components/responses/Outcome"
  /api/sessions:
    post:
      operationId: createSession
      security: []
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Authenticated Account Channel session
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        default:
          $ref: "#/components/responses/Outcome"
  /api/session/refresh:
    post:
      operationId: refreshSession
      security: []
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSessionRequest"
      responses:
        "200":
          description: Rotated Account Channel credentials
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSession"
        default:
          $ref: "#/components/responses/Outcome"
  /api/session:
    delete:
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "204":
          description: Current Account Channel session revoked
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
        default:
          $ref: "#/components/responses/Outcome"
  /api/service-policy:
    get:
      operationId: getServicePolicy
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Effective bounded Host policy
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePolicy"
        default:
          $ref: "#/components/responses/Outcome"
  /api/replicas:
    get:
      operationId: listHostedReplicas
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Hosted Replicas currently granted to this Channel Principal
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedReplicaList"
        default:
          $ref: "#/components/responses/Outcome"
    post:
      operationId: createHostedReplica
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "201":
          description: New Host-local Replica and initial managing Grant
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedReplicaSummary"
        default:
          $ref: "#/components/responses/Outcome"
  /api/replicas/{replica_handle}:
    delete:
      operationId: reapHostedReplica
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ReplicaHandle"
      responses:
        "202":
          description: Hosted Replica fenced for asynchronous opaque-byte reaping
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReapingResult"
        default:
          $ref: "#/components/responses/Outcome"
  /api/replicas/{replica_handle}/grants:
    post:
      operationId: createReplicaAccessGrant
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ReplicaHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReplicaAccessGrantRequest"
      responses:
        "201":
          description: New immutable Host-local Replica Access Grant
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplicaAccessGrant"
        default:
          $ref: "#/components/responses/Outcome"
  /api/replicas/{replica_handle}/grants/{grant_id}:
    delete:
      operationId: revokeReplicaAccessGrant
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ReplicaHandle"
        - $ref: "#/components/parameters/GrantId"
      responses:
        "204":
          description: Exact Host-local Replica Access Grant revoked
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
        default:
          $ref: "#/components/responses/Outcome"
  /api/replicas/{replica_handle}/inventory:
    get:
      operationId: listOpaqueInventory
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ReplicaHandle"
        - in: query
          name: snapshot_cursor
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
        - in: query
          name: position
          required: false
          schema:
            $ref: "#/components/schemas/Base64Url32"
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: One immutable snapshot-bounded opaque inventory page
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpaqueInventoryPage"
        default:
          $ref: "#/components/responses/Outcome"
  /api/replicas/{replica_handle}/hint:
    get:
      operationId: readWakeHint
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ReplicaHandle"
      responses:
        "200":
          description: Current advisory Hosted Replica Wake Hint cursor
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WakeHint"
        default:
          $ref: "#/components/responses/Outcome"
    post:
      operationId: publishWakeHint
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ReplicaHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: Advanced advisory Hosted Replica Wake Hint cursor
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WakeHint"
        default:
          $ref: "#/components/responses/Outcome"
  /api/replicas/{replica_handle}/items/{storage_item_id}:
    put:
      operationId: admitCompactOpaqueItem
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ReplicaHandle"
        - $ref: "#/components/parameters/StorageItemId"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Exact item was already present
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdmissionResult"
        "201":
          description: Exact Compact item was durably admitted
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdmissionResult"
        default:
          $ref: "#/components/responses/Outcome"
    get:
      operationId: readOpaqueItem
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ReplicaHandle"
        - $ref: "#/components/parameters/StorageItemId"
        - in: header
          name: Range
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Exact complete opaque item bytes
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
            Awsm-Storage-Item-ID:
              required: true
              schema:
                $ref: "#/components/schemas/Base64Url32"
            Awsm-Storage-Class:
              required: true
              schema:
                $ref: "#/components/schemas/StorageClass"
            Awsm-Byte-Length:
              required: true
              schema:
                type: string
                pattern: "^[1-9][0-9]*$"
            Awsm-Ciphertext-Digest:
              required: true
              schema:
                $ref: "#/components/schemas/Base64Url32"
            Accept-Ranges:
              required: false
              schema:
                type: string
                enum: [bytes]
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Exact stored Streamable byte range
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
            Awsm-Storage-Item-ID:
              required: true
              schema:
                $ref: "#/components/schemas/Base64Url32"
            Awsm-Storage-Class:
              required: true
              schema:
                type: string
                enum: [streamable]
            Awsm-Byte-Length:
              required: true
              schema:
                type: string
                pattern: "^[1-9][0-9]*$"
            Awsm-Ciphertext-Digest:
              required: true
              schema:
                $ref: "#/components/schemas/Base64Url32"
            Accept-Ranges:
              required: true
              schema:
                type: string
                enum: [bytes]
            Content-Range:
              required: true
              schema:
                type: string
                pattern: "^bytes (0|[1-9][0-9]*)-(0|[1-9][0-9]*)/[1-9][0-9]*$"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Outcome"
  /api/replicas/{replica_handle}/uploads:
    post:
      operationId: prepareStreamableUpload
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ReplicaHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrepareUploadRequest"
      responses:
        "201":
          description: Independent resumable Streamable upload Prepared Data
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparedUpload"
        default:
          $ref: "#/components/responses/Outcome"
  /api/replicas/{replica_handle}/uploads/{upload_handle}/capability:
    post:
      operationId: renewUploadCapability
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/ReplicaHandle"
        - $ref: "#/components/parameters/UploadHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: Rotated short-lived transfer capability for existing Prepared Data
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparedUpload"
        default:
          $ref: "#/components/responses/Outcome"
  /api/uploads/{upload_handle}:
    put:
      operationId: appendUploadPart
      security:
        - uploadBearer: []
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/UploadHandle"
        - in: header
          name: Awsm-Upload-Offset
          required: true
          schema:
            type: string
            pattern: "^(0|[1-9][0-9]*)$"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Part accepted or exact prior part replayed idempotently
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadProgress"
        default:
          $ref: "#/components/responses/Outcome"
  /api/uploads/{upload_handle}/finalize:
    post:
      operationId: finalizeStreamableUpload
      security:
        - uploadBearer: []
      parameters:
        - $ref: "#/components/parameters/ProtocolVersion"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/UploadHandle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "200":
          description: Exact item was already present
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdmissionResult"
        "201":
          description: Complete Streamable item was verified and durably admitted
          headers:
            Awsm-Protocol-Version:
              $ref: "#/components/headers/ProtocolVersion"
            Awsm-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdmissionResult"
        default:
          $ref: "#/components/responses/Outcome"
components:
  securitySchemes:
    accountBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
    uploadBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-upload-capability
  parameters:
    ProtocolVersion:
      in: header
      name: Awsm-Protocol-Version
      required: true
      schema:
        type: string
        enum: ["1"]
    RequestId:
      in: header
      name: Awsm-Request-ID
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ReplicaHandle:
      in: path
      name: replica_handle
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    GrantId:
      in: path
      name: grant_id
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    StorageItemId:
      in: path
      name: storage_item_id
      required: true
      schema:
        $ref: "#/components/schemas/Base64Url32"
    UploadHandle:
      in: path
      name: upload_handle
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
  headers:
    ProtocolVersion:
      required: true
      schema:
        type: string
        enum: ["1"]
    RequestId:
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
  responses:
    Outcome:
      description: Stable Host protocol outcome
      headers:
        Awsm-Protocol-Version:
          $ref: "#/components/headers/ProtocolVersion"
        Awsm-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Outcome"
  schemas:
    Uuid:
      type: string
      format: uuid
    Username:
      type: string
      minLength: 3
      maxLength: 32
      pattern: "^[a-z0-9](?:[a-z0-9_-]{1,30}[a-z0-9])?$"
    Base64Url32:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"
    StorageClass:
      type: string
      enum: [compact, streamable]
    ReplicaCapability:
      type: string
      enum:
        - awsm.replica.hint.read
        - awsm.replica.hint.write
        - awsm.replica.inventory.read
        - awsm.replica.item.read
        - awsm.replica.item.write
        - awsm.replica.manage
    EmptyObject:
      type: object
      additionalProperties: false
    ServerInformation:
      type: object
      additionalProperties: false
      required:
        - service
        - protocol_version
        - replica_capabilities
        - registration
        - account_policy
      properties:
        service:
          type: string
          enum: [AWSM Replica Host]
        protocol_version:
          type: string
          enum: ["1"]
        replica_capabilities:
          type: array
          minItems: 6
          maxItems: 6
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ReplicaCapability"
        registration:
          oneOf:
            - type: object
              additionalProperties: false
              required: [enabled, sign_up_url]
              properties:
                enabled:
                  type: boolean
                  enum: [true]
                sign_up_url:
                  type: string
                  format: uri
            - type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                  enum: [false]
        account_policy:
          type: object
          additionalProperties: false
          required: [inactive_retention_days]
          properties:
            inactive_retention_days:
              type: integer
              minimum: 1
              maximum: 36500
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          type: string
          minLength: 1
          maxLength: 1024
    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 1024
    AccountSummary:
      type: object
      additionalProperties: false
      required: [username, inactive_deletion_at]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        inactive_deletion_at:
          type: string
          format: date-time
    AuthenticatedSession:
      type: object
      additionalProperties: false
      required:
        - account
        - session_id
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_expires_at
      properties:
        account:
          $ref: "#/components/schemas/AccountSummary"
        session_id:
          $ref: "#/components/schemas/Uuid"
        access_token:
          type: string
          minLength: 1
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          minLength: 1
        refresh_expires_at:
          type: string
          format: date-time
    ServicePolicy:
      type: object
      additionalProperties: false
      required:
        - inactive_account_retention_days
        - upload_staging_expiry_hours
        - upload_capability_lifetime_seconds
        - maximum_upload_part_bytes
        - maximum_upload_parts
        - maximum_compact_payload_bytes
        - maximum_streamable_payload_bytes
        - maximum_inventory_page_size
        - range_reads
        - resumable_uploads
        - wake_hints
      properties:
        inactive_account_retention_days:
          type: integer
          minimum: 1
          maximum: 36500
        upload_staging_expiry_hours:
          type: integer
          minimum: 1
        upload_capability_lifetime_seconds:
          type: integer
          minimum: 1
        maximum_upload_part_bytes:
          type: integer
          minimum: 1
        maximum_upload_parts:
          type: integer
          minimum: 1
        maximum_compact_payload_bytes:
          type: integer
          minimum: 16
          maximum: 16777216
        maximum_streamable_payload_bytes:
          type: integer
          minimum: 16
          maximum: 9007199254736883
        maximum_inventory_page_size:
          type: integer
          minimum: 1
          maximum: 500
        range_reads:
          type: boolean
          enum: [true]
        resumable_uploads:
          type: boolean
          enum: [true]
        wake_hints:
          type: boolean
          enum: [true]
    HostedReplicaSummary:
      type: object
      additionalProperties: false
      required: [replica_handle, capabilities, quota_bytes, stored_bytes]
      properties:
        replica_handle:
          $ref: "#/components/schemas/Uuid"
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ReplicaCapability"
        quota_bytes:
          type: integer
          minimum: 1
          nullable: true
        stored_bytes:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    HostedReplicaList:
      type: object
      additionalProperties: false
      required: [replicas]
      properties:
        replicas:
          type: array
          items:
            $ref: "#/components/schemas/HostedReplicaSummary"
    CreateReplicaAccessGrantRequest:
      type: object
      additionalProperties: false
      required: [username, capabilities, grantable_capabilities]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        capabilities:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ReplicaCapability"
        grantable_capabilities:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ReplicaCapability"
    ReplicaAccessGrant:
      type: object
      additionalProperties: false
      required:
        - grant_id
        - replica_handle
        - username
        - capabilities
        - grantable_capabilities
      properties:
        grant_id:
          $ref: "#/components/schemas/Uuid"
        replica_handle:
          $ref: "#/components/schemas/Uuid"
        username:
          $ref: "#/components/schemas/Username"
        capabilities:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ReplicaCapability"
        grantable_capabilities:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ReplicaCapability"
    ReapingResult:
      type: object
      additionalProperties: false
      required: [replica_handle, state, reaping_job_id]
      properties:
        replica_handle:
          $ref: "#/components/schemas/Uuid"
        state:
          type: string
          enum: [reaping]
        reaping_job_id:
          $ref: "#/components/schemas/Uuid"
    OpaqueInventoryItem:
      type: object
      additionalProperties: false
      required: [storage_item_id, storage_class, byte_length, ciphertext_digest]
      properties:
        storage_item_id:
          $ref: "#/components/schemas/Base64Url32"
        storage_class:
          $ref: "#/components/schemas/StorageClass"
        byte_length:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        ciphertext_digest:
          $ref: "#/components/schemas/Base64Url32"
    OpaqueInventoryPage:
      type: object
      additionalProperties: false
      required: [snapshot_cursor, next_position, items]
      properties:
        snapshot_cursor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        next_position:
          allOf:
            - $ref: "#/components/schemas/Base64Url32"
          nullable: true
        items:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/OpaqueInventoryItem"
    AdmissionResult:
      type: object
      additionalProperties: false
      required: [storage_item_id, byte_length, admission, hint_cursor]
      properties:
        storage_item_id:
          $ref: "#/components/schemas/Base64Url32"
        byte_length:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        admission:
          type: string
          enum: [stored, already_present]
        hint_cursor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    WakeHint:
      type: object
      additionalProperties: false
      required: [hint_cursor]
      properties:
        hint_cursor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    PrepareUploadRequest:
      type: object
      additionalProperties: false
      required: [storage_item_id, byte_length, ciphertext_digest]
      properties:
        storage_item_id:
          $ref: "#/components/schemas/Base64Url32"
        byte_length:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        ciphertext_digest:
          $ref: "#/components/schemas/Base64Url32"
    PreparedUpload:
      type: object
      additionalProperties: false
      required:
        - upload_handle
        - accepted_offset
        - maximum_part_length
        - transfer_capability
      properties:
        upload_handle:
          $ref: "#/components/schemas/Uuid"
        accepted_offset:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        maximum_part_length:
          type: integer
          minimum: 1
          maximum: 1073741824
        transfer_capability:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
    UploadProgress:
      type: object
      additionalProperties: false
      required: [accepted_offset]
      properties:
        accepted_offset:
          type: integer
          minimum: 0
          maximum: 9007199254740991
    Outcome:
      type: object
      additionalProperties: false
      required: [outcome, retryable, request_id, retry_after_seconds]
      properties:
        outcome:
          type: string
          enum:
            - authentication_required
            - access_denied
            - replica_not_found
            - item_not_found
            - item_integrity_conflict
            - outer_envelope_invalid
            - range_invalid
            - upload_incomplete
            - upload_expired
            - quota_exceeded
            - rate_limited
            - cursor_invalid
            - request_conflict
            - service_unavailable
            - protocol_invalid
        retryable:
          type: boolean
        request_id:
          $ref: "#/components/schemas/Uuid"
        retry_after_seconds:
          type: integer
          minimum: 0
          nullable: true
